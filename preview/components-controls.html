<!doctype html><html><head><meta charset="utf-8">
<script>/* dark-first (1.11 Dusk): stored pref wins; no pref = dark */(function(){var t=null;try{t=localStorage.getItem('gr-theme')}catch(e){}var d=t==='light'?'light':t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):'dark';document.documentElement.setAttribute('data-theme',d);})()</script><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,0,0"><style>
body{margin:0;padding:20px;background:var(--p-shell);display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.g{display:flex;flex-direction:column;gap:10px}
.lbl{font:500 11px/1.2 'JetBrains Mono',monospace;color:var(--p-muted)}

/* Foundation toggle — pill track with knob riding on top */
.tg{width:37px;height:20px;position:relative;cursor:pointer;display:inline-block}
.tg .track{position:absolute;inset:0;border-radius:999px;background:var(--p-border-strong);transition:background .15s}
.tg .knob{position:absolute;top:0;left:0;width:20px;height:20px;border-radius:50%;background:var(--p-surface);border:.5px solid var(--p-border-strong);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}  /* 1.11.2: knob = --p-surface, never #fff */
.tg.on .track{background:var(--p-primary)}  /* 1.11.2: ON track = SOLID fill */
.tg.on .knob{left:17px;border-color:var(--p-primary)}  /* knob stays surface-colored */
.tg.genstock.on .track{background:var(--p-genstock)}  /* color prop (1.7) — concept-colored switch */
.tg.dis .track{background:var(--p-border)}
.tg.dis .knob{background:var(--p-surface-tint)}

/* Checkbox */
.cb{width:18px;height:18px;border:1.5px solid var(--p-border-strong);border-radius:1px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--p-surface)}  /* 1.11.2: 1px radius */
.cb.on{background:var(--p-primary);border-color:var(--p-primary)}
.cb.on span{color:var(--p-action-fg)}  /* 1.11.2: check glyph = --p-action-fg */
.cb.dis{background:var(--p-surface-tint);border-color:var(--p-border-strong);cursor:not-allowed}
.cb.dis span{color:var(--p-placeholder)}

/* Radio */
.rd{width:18px;height:18px;border:1.5px solid var(--p-border-strong);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.rd.on{border-color:#1861AF}
.rd.on::after{content:"";width:8px;height:8px;border-radius:50%;background:#1861AF}

.row{display:flex;gap:10px;align-items:center;font:400 14px Inter;color:var(--p-ink)}
</style></head><body>
<div class="g">
  <span class="lbl">TOGGLE</span>
  <div class="row"><span class="tg on"><span class="track"></span><span class="knob"></span></span>On</div>
  <div class="row"><span class="tg"><span class="track"></span><span class="knob"></span></span>Off</div>
</div>
<div class="g">
  <span class="lbl">TOGGLE · color (1.7)</span>
  <div class="row"><span class="tg genstock on"><span class="track"></span><span class="knob"></span></span>General Stock (purple)</div>
  <div class="row"><span class="tg"><span class="track"></span><span class="knob"></span></span>Default (blue)</div>
</div>
<div class="g">
  <span class="lbl">CHECKBOX</span>
  <div class="row"><span class="cb on"><span style="font-family:'Material Symbols Sharp';font-size:14px;line-height:1">check</span></span>Checked</div>
  <div class="row"><span class="cb"></span>Unchecked</div>
  <div class="row"><span class="cb dis on"><span style="font-family:'Material Symbols Sharp';font-size:14px;line-height:1">check</span></span>Disabled (1.5)</div>
</div>
<div class="g">
  <span class="lbl">RADIO</span>
  <div class="row"><span class="rd on"></span>Selected</div>
  <div class="row"><span class="rd"></span>Unselected</div>
</div>
</body></html>
